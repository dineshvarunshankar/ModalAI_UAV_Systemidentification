# Pegasus quadrotor motor parameters
# Source: starling2_sweep_2026-05-27_214436.csv
# Generated by analyze_sweep.py
#
# NOTE: field names below follow the Pegasus 'Multirotor' / 'Quadrotor'
# config convention. Verify against your AirStack/Pegasus fork — names
# may differ slightly across versions. The physical meaning is the same.

motor:
  # T = rotor_constant * omega^2  [N, omega in rad/s]
  rotor_constant: -1.169450e-06

  # tau_z = rolling_moment_coefficient * omega^2  [N*m]
  rolling_moment_coefficient: 1.083366e-08

  # ratio: c_M / c_T  (used in some Pegasus versions instead of c_M)
  yaw_to_thrust_ratio: nan

  # Maximum rotor angular velocity observed during sweep (rad/s)
  max_rotor_velocity: 1051.386

  # First-order motor time constant (seconds).
  # Source: starling2_stepresponse.csv
  # Patched by analyze_step_response.py
  # Robust median across 20/20 fits (std 2303 ms across inliers)
  motor_time_constant: 0.1841

  # Throttle command interpretation
  throttle:
    pwm_min_us: 1200
    pwm_max_us: 2000
    # Throttle u = (pwm_us - 1000) / 1000, in [0, 1] over [1000, 2000] us
    polynomial_throttle_to_thrust_N:   [0.7055485384113184, -1.3212392258721808, -0.785252452165475, 0.09588494958507522]
    polynomial_throttle_to_omega_rads: [56.51135644989614, -645.4764304139728, 1629.393366829579, 14.484484191836758]

power_envelope:
  voltage_nominal_V: 7.97
  current_max_observed_A: 3.51
  electrical_power_max_W: 27.0
  thrust_max_observed_N: -0.12
